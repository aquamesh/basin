name: Refresh drought data
on:
  schedule:
    - cron: "17 16 * * 4"   # Thursdays, after the weekly Drought Monitor release
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/update_drought.py
      - name: Commit if changed
        run: |
          if git diff --quiet data/drought.json; then echo "no change"; exit 0; fi
          git config user.name "basin-bot"
          git config user.email "basin-bot@users.noreply.github.com"
          git add data/drought.json
          git commit -m "Refresh U.S. Drought Monitor data"
          git push
